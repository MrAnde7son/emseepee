databases:
  - name: emseepee-postgres

services:
  - type: web
    name: emseepee-backend
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_API_PORT
        value: 8000
      - key: POSTGRES_HOST
        fromDatabase:
          name: emseepee-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: emseepee-postgres
          property: port
      - key: POSTGRES_DATABASE
        fromDatabase:
          name: emseepee-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: emseepee-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: emseepee-postgres
          property: password
  - type: web
    name: emseepee-frontend
    env: node
    buildCommand: pnpm install --frozen-lockfile && cd dashboard && pnpm run build
    startCommand: cd dashboard && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        value: https://emseepee-backend.onrender.com
