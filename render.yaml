services:
  - type: web
    name: hakuna-backend
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_API_PORT
        value: 8000
  - type: web
    name: hakuna-frontend
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: cd dashboard && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        value: https://hakuna-backend.onrender.com
